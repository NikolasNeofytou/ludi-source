<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teammate seat sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&amp;family=Literata:opsz,wght@7..72,500..600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#175E77}a:hover{color:#0F3F52}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 40px; background: #F2F4F3; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; color: #10181C">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="width: 190px; height: 22px; border-radius: 6px; background: rgba(16,24,28,0.12)"></div>
<div style="width: 130px; height: 12px; border-radius: 6px; background: rgba(16,24,28,0.08)"></div>
<div style="height: 118px; border-radius: 20px; background: #FFFFFF; margin-top: 6px"></div>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 6px">
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(16,24,28,0.12)"></div><div style="width: 150px; height: 12px; border-radius: 6px; background: rgba(16,24,28,0.1)"></div></div>
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(16,24,28,0.12)"></div><div style="width: 120px; height: 12px; border-radius: 6px; background: rgba(16,24,28,0.1)"></div></div>
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(16,24,28,0.12)"></div><div style="width: 170px; height: 12px; border-radius: 6px; background: rgba(16,24,28,0.1)"></div></div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(16,24,28,0.42)"></div>

<div role="dialog" aria-label="Andreas, teammate" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 8px 22px 34px; display: flex; flex-direction: column; gap: 16px">
<div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(16,24,28,0.18); margin-bottom: 2px"></div>

<div style="display: flex; align-items: center; gap: 13px">
<div style="width: 50px; height: 50px; border-radius: 50%; background: #4E6E7A; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4.5px #BF4429; display: flex; align-items: center; justify-content: center; flex: none; font-family: 'Fraunces', 'Literata', Georgia, serif; font-weight: 600; font-size: 21px; color: #FFFFFF">A</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Fraunces', 'Literata', Georgia, serif; font-weight: 600; font-size: 23px; line-height: 28px; color: #10181C">Andreas</div>
<div style="font-size: 13px; line-height: 17px; color: #5F6E73">Outfield · Organiser</div>
</div>
<div style="flex: none; background: #DFECE3; border-radius: 999px; padding: 4px 9px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.8px; color: #174028">PAID</div>
</div>

<div style="display: flex; align-items: center; gap: 12px; background: #DCE9EC; border-radius: 14px; padding: 11px 14px">
<div style="font-family: 'Fraunces', 'Literata', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 32px; color: #0F3F52">3</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 15px; line-height: 19px; font-weight: 600; color: #10181C">matches together</div>
<div style="font-size: 12.5px; line-height: 16px; color: #3F4C51">Joined this one Tue 14 Oct</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 14px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 10.5px; letter-spacing: 1px; font-weight: 700; color: #5F6E73">POSITION</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<div style="display: flex; align-items: center; gap: 7px; background: #10181C; border-radius: 10px; padding: 6px 10px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #FBF8F0">ST</span><span style="font-size: 13px; font-weight: 600; color: #FBF8F0">Striker</span></div>
<div style="display: flex; align-items: center; gap: 7px; background: #DCE9EC; border-radius: 10px; padding: 6px 10px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #0F3F52">RW</span><span style="font-size: 13px; color: #0F3F52">Right wing</span></div>
</div>
</div>
<svg width="56" height="74" viewBox="0 0 56 74" role="img" aria-label="Plays ST, also RW" style="flex: none">
<rect x="0.75" y="0.75" width="54.5" height="72.5" rx="5" fill="#F2F4F3" stroke="rgba(16,24,28,0.16)" stroke-width="1"></rect>
<path d="M1 37 H55" stroke="rgba(16,24,28,0.16)" stroke-width="1"></path>
<circle cx="28" cy="37" r="7" fill="none" stroke="rgba(16,24,28,0.16)" stroke-width="1"></circle>
<rect x="16" y="0.75" width="24" height="10" fill="none" stroke="rgba(16,24,28,0.16)" stroke-width="1"></rect>
<rect x="16" y="63.25" width="24" height="10" fill="none" stroke="rgba(16,24,28,0.16)" stroke-width="1"></rect>
<g fill="rgba(16,24,28,0.28)">
<circle cx="9.1" cy="16.8" r="1.8"></circle>
<circle cx="28" cy="24" r="1.8"></circle>
<circle cx="28" cy="34.8" r="1.8"></circle>
<circle cx="28" cy="45.6" r="1.8"></circle>
<circle cx="8" cy="51.4" r="1.8"></circle>
<circle cx="48" cy="51.4" r="1.8"></circle>
<circle cx="28" cy="56.4" r="1.8"></circle>
<circle cx="28" cy="67.2" r="1.8"></circle>
</g>
<circle cx="46.9" cy="16.8" r="3.6" fill="#FFFFFF" stroke="#BF4429" stroke-width="1.6"></circle>
<circle cx="28" cy="8" r="5" fill="#BF4429"></circle>
</svg>
</div>

<div style="height: 1px; background: rgba(16,24,28,0.08)"></div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 10.5px; letter-spacing: 1px; font-weight: 700; color: #5F6E73">LEVEL</span>
<span style="font-family: 'Fraunces', 'Literata', Georgia, serif; font-weight: 600; font-size: 17px; line-height: 22px; color: #10181C">Regular</span>
</div>
<div style="display: flex; gap: 4px" aria-label="Level 3 of 5">
<div style="width: 18px; height: 6px; border-radius: 3px; background: #175E77"></div>
<div style="width: 18px; height: 6px; border-radius: 3px; background: #175E77"></div>
<div style="width: 18px; height: 6px; border-radius: 3px; background: #175E77"></div>
<div style="width: 18px; height: 6px; border-radius: 3px; background: #DCE9EC"></div>
<div style="width: 18px; height: 6px; border-radius: 3px; background: #DCE9EC"></div>
</div>
</div>
<div style="font-size: 12.5px; line-height: 16px; color: #5F6E73">Plays local pickup often</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 10px">
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 10.5px; letter-spacing: 1px; font-weight: 700; color: #5F6E73">FOOT</div>
<div style="display: flex; align-items: center; gap: 6px; font-family: 'Fraunces', 'Literata', Georgia, serif; font-weight: 600; font-size: 15px; line-height: 19px; color: #10181C"><svg width="16" height="14" viewBox="0 0 18 16" aria-hidden="true"><rect x="1.5" y="1" width="6" height="14" rx="3" fill="none" stroke="#10181C" stroke-width="1.3" transform="rotate(-6 4.5 8)"></rect><rect x="10.5" y="1" width="6" height="14" rx="3" fill="#10181C" stroke="#10181C" stroke-width="1.3" transform="rotate(6 13.5 8)"></rect></svg>Right</div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 10.5px; letter-spacing: 1px; font-weight: 700; color: #5F6E73">HEIGHT</div>
<div style="font-family: 'Fraunces', 'Literata', Georgia, serif; font-weight: 600; font-size: 15px; line-height: 19px; color: #10181C">181 cm</div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 10.5px; letter-spacing: 1px; font-weight: 700; color: #5F6E73">AGE</div>
<div style="font-family: 'Fraunces', 'Literata', Georgia, serif; font-weight: 600; font-size: 15px; line-height: 19px; color: #10181C">26–35</div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 10.5px; letter-spacing: 1px; font-weight: 700; color: #5F6E73">PLAYS</div>
<div style="font-family: 'Fraunces', 'Literata', Georgia, serif; font-weight: 600; font-size: 15px; line-height: 19px; color: #10181C">Weekly</div>
</div>
</div>

<div style="display: flex; flex-direction: column; align-items: stretch; gap: 2px; margin-top: 4px">
<a href="front.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 999px; background: #175E77; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">View full card</a>
<button type="button" style="height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #3F4C51; cursor: pointer">Close</button>
</div>
</div>

</div>
</x-dc>

</html>
