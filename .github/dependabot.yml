# Dependabot configuration — automated dependency updates.
# Tracked in threat-model.md §Security hygiene baseline. No ADR: this
# executes a pre-recorded plan, it does not establish a new invariant.
#
# Strategy: weekly, low-noise. Minor + patch bumps are grouped into a
# single PR per ecosystem so the founder reviews one digest, not ten.
# Major bumps arrive as individual PRs because they need real review.
version: 2

updates:
  # JS/TS dependencies across the whole pnpm workspace. A single root
  # pnpm-lock.yaml backs every package, so the `directories` glob lets
  # one entry cover the root plus every app and package without listing
  # each manifest by hand.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Nicosia"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - "NikolasNeofytou"
    # The Expo SDK pins these to versions that match its native code, and
    # `npx expo install --fix` is what moves them. A raw-latest bump here
    # can't merge on the current SDK, and because it sat inside the grouped
    # digest, it stalled every other update with it (#323, Oct 2026).
    # Advisories against these still show up as Dependabot alerts; fix
    # them with `expo install` (or the next SDK hop), not a raw bump.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-*/*"
      - dependency-name: "@stripe/stripe-react-native"
      - dependency-name: "@sentry/react-native"
    groups:
      # One digest PR for all non-breaking bumps, prod + dev together.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions pinned in .github/workflows/. Keeps the CI action
  # versions (checkout, setup-node, pnpm/action-setup, etc.) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Nicosia"
    commit-message:
      prefix: "ci"
      include: "scope"
    assignees:
      - "NikolasNeofytou"
    groups:
      # Group ALL action bumps, majors included. Action updates are
      # low-risk on GitHub-hosted runners, and several majors at once
      # would otherwise open N separate PRs that each edit ci.yml and
      # conflict with one another (as the first run did). One digest
      # PR avoids the rebase dance.
      actions:
        patterns:
          - "*"
